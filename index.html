<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Polling Kepala Desa Langko</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f6f8;
      color: #222;
    }

    .container {
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.10);
    }

    h1 {
      text-align: center;
      color: #087f5b;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
    }

    .candidate {
      border: 2px solid #ddd;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
      cursor: pointer;
      transition: 0.2s;
    }

    .candidate:hover {
      border-color: #087f5b;
      background: #f0fff9;
    }

    .candidate input {
      margin-right: 10px;
    }

    .candidate-name {
      font-size: 18px;
      font-weight: bold;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #087f5b;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
    }

    button:hover {
      background: #066b4c;
    }

    .result {
      margin-top: 30px;
    }

    .result h2 {
      margin-bottom: 15px;
      color: #087f5b;
    }

    .result-item {
      margin-bottom: 15px;
    }

    .bar {
      width: 100%;
      height: 25px;
      background: #e5e5e5;
      border-radius: 20px;
      overflow: hidden;
      margin-top: 5px;
    }

    .fill {
      height: 100%;
      background: #087f5b;
      width: 0%;
      transition: width 0.5s;
    }

    .hidden {
      display: none;
    }

    .footer {
      text-align: center;
      margin-top: 25px;
      color: #777;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <h1>POLING KEPALA DESA LANGKO</h1>

      <p class="subtitle">
        Silakan pilih calon Kepala Desa pilihan Anda
      </p>

      <form id="pollForm">

        <label class="candidate">
          <input type="radio" name="candidate" value="Calon 1">
          <span class="candidate-name">Calon 1</span>
        </label>

        <label class="candidate">
          <input type="radio" name="candidate" value="Calon 2">
          <span class="candidate-name">Calon 2</span>
        </label>

        <label class="candidate">
          <input type="radio" name="candidate" value="Calon 3">
          <span class="candidate-name">Calon 3</span>
        </label>

        <label class="candidate">
          <input type="radio" name="candidate" value="Calon 4">
          <span class="candidate-name">Calon 4</span>
        </label>

        <button type="submit">
          KIRIM PILIHAN
        </button>

      </form>

      <div id="result" class="result hidden">

        <h2>Hasil Polling</h2>

        <div class="result-item">
          <strong>Calon 1</strong>
          <span id="count1">0 suara</span>
          <div class="bar">
            <div id="bar1" class="fill"></div>
          </div>
        </div>

        <div class="result-item">
          <strong>Calon 2</strong>
          <span id="count2">0 suara</span>
          <div class="bar">
            <div id="bar2" class="fill"></div>
          </div>
        </div>

        <div class="result-item">
          <strong>Calon 3</strong>
          <span id="count3">0 suara</span>
          <div class="bar">
            <div id="bar3" class="fill"></div>
          </div>
        </div>

        <div class="result-item">
          <strong>Calon 4</strong>
          <span id="count4">0 suara</span>
          <div class="bar">
            <div id="bar4" class="fill"></div>
          </div>
        </div>

      </div>

      <div class="footer">
        Polling Kepala Desa Langko
      </div>

    </div>

  </div>

  <script>

    let votes = {
      "Calon 1": 0,
      "Calon 2": 0,
      "Calon 3": 0,
      "Calon 4": 0
    };

    document
      .getElementById("pollForm")
      .addEventListener("submit", function(event) {

        event.preventDefault();

        const selected = document.querySelector(
          'input[name="candidate"]:checked'
        );

        if (!selected) {
          alert("Silakan pilih calon terlebih dahulu.");
          return;
        }

        votes[selected.value]++;

        updateResults();

        document.getElementById("result")
          .classList.remove("hidden");

        alert("Terima kasih, pilihan Anda sudah tercatat.");

      });

    function updateResults() {

      const total =
        votes["Calon 1"] +
        votes["Calon 2"] +
        votes["Calon 3"] +
        votes["Calon 4"];

      for (let i = 1; i <= 4; i++) {

        const name = "Calon " + i;
        const count = votes[name];

        document.getElementById("count" + i)
          .textContent = count + " suara";

        const percentage =
          total === 0 ? 0 : (count / total) * 100;

        document.getElementById("bar" + i)
          .style.width = percentage + "%";
      }
    }

  </script>

</body>
</html>
